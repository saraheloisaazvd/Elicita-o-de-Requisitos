<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 990" width="1620" height="990" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#111" stroke-width="1.6"/>
    </marker>
    <marker id="msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#C53030" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1620" height="990" fill="#fff"/>

  <!-- Título -->
  <text x="810" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1A365D">E-COMMERCE DE SEMIJOIAS  •  Processo de Venda Online</text>
  <text x="810" y="84" text-anchor="middle" font-size="16" fill="#4A5568">BPMN  •  Piscina Cliente  +  Piscina Loja (2 raias: Vendas / Logística)</text>

  <!-- ================= PISCINA CLIENTE ================= -->
  <rect x="40" y="120" width="1540" height="180" fill="#fff" stroke="#1A365D" stroke-width="3"/>
  <line x1="84" y1="120" x2="84" y2="300" stroke="#1A365D" stroke-width="2"/>
  <text transform="translate(68,210) rotate(-90)" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A365D">CLIENTE</text>

  <!-- Início -->
  <circle cx="150" cy="210" r="22" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="150" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Início</text>

  <!-- Tarefas Cliente -->
  <g fill="#EAF0FF" stroke="#2B6CB0" stroke-width="2">
    <rect x="210" y="175" width="150" height="70" rx="12"/>
    <rect x="410" y="175" width="150" height="70" rx="12"/>
    <rect x="610" y="175" width="150" height="70" rx="12"/>
    <rect x="1325" y="175" width="150" height="70" rx="12"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">
    <text x="285" y="192">Navegar no site</text><text x="285" y="210">e escolher</text><text x="285" y="228">semijoia</text>
    <text x="485" y="192">Adicionar ao</text><text x="485" y="210">carrinho e</text><text x="485" y="228">finalizar pedido</text>
    <text x="685" y="202">Realizar</text><text x="685" y="218">pagamento</text>
    <text x="1400" y="202">Receber produto</text><text x="1400" y="218">e avaliar compra</text>
  </g>

  <!-- Fim -->
  <circle cx="1540" cy="210" r="22" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="1540" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Fim</text>

  <!-- Fluxo Cliente -->
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="172" y1="210" x2="210" y2="210"/>
    <line x1="360" y1="210" x2="410" y2="210"/>
    <line x1="560" y1="210" x2="610" y2="210"/>
    <line x1="1475" y1="210" x2="1518" y2="210"/>
  </g>

  <!-- ================= PISCINA LOJA ================= -->
  <rect x="40" y="360" width="1540" height="520" fill="#fff" stroke="#1A365D" stroke-width="3"/>
  <line x1="84" y1="360" x2="84" y2="880" stroke="#1A365D" stroke-width="2"/>
  <text transform="translate(68,620) rotate(-90)" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A365D">LOJA</text>
  <!-- divisória entre raias -->
  <line x1="84" y1="620" x2="1580" y2="620" stroke="#1A365D" stroke-width="2"/>
  <text x="100" y="386" font-size="13" font-weight="bold" fill="#2B6CB0">RAIA 1 · VENDAS / ATENDIMENTO</text>
  <text x="100" y="646" font-size="13" font-weight="bold" fill="#2B6CB0">RAIA 2 · ESTOQUE / LOGÍSTICA</text>

  <!-- Tarefas Raia 1 -->
  <g fill="#EAF0FF" stroke="#2B6CB0" stroke-width="2">
    <rect x="610" y="430" width="150" height="70" rx="12"/>
    <rect x="900" y="430" width="150" height="70" rx="12"/>
    <rect x="1325" y="430" width="150" height="70" rx="12"/>
  </g>
  <rect x="745" y="533" width="150" height="64" rx="12" fill="#FED7D7" stroke="#C53030" stroke-width="2"/>

  <!-- Tarefas Raia 2 -->
  <g fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2">
    <rect x="1180" y="655" width="150" height="70" rx="12"/>
    <rect x="1180" y="775" width="150" height="70" rx="12"/>
  </g>

  <g font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">
    <text x="685" y="447">Receber pedido</text><text x="685" y="465">e confirmar</text><text x="685" y="483">pagamento</text>
    <text x="975" y="447">Confirmar pedido</text><text x="975" y="465">e emitir</text><text x="975" y="483">nota fiscal</text>
    <text x="1400" y="457">Confirmar envio</text><text x="1400" y="473">para o cliente</text>
    <text x="820" y="547">Notificar</text><text x="820" y="565">pagamento</text><text x="820" y="583">recusado</text>
    <text x="1255" y="672">Reservar e</text><text x="1255" y="690">separar semijoia</text><text x="1255" y="708">no estoque</text>
    <text x="1255" y="792">Embalar e</text><text x="1255" y="810">postar pedido</text><text x="1255" y="828">nos Correios</text>
  </g>

  <!-- Gateway exclusivo (X) -->
  <polygon points="820,433 852,465 820,497 788,465" fill="#FDF6E0" stroke="#111" stroke-width="2.5"/>
  <path d="M810,455 L830,475 M830,455 L810,475" stroke="#444" stroke-width="3" fill="none"/>
  <text x="820" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Pagamento aprovado?</text>

  <!-- Gateway paralelo de abertura (+) -->
  <polygon points="1130,433 1162,465 1130,497 1098,465" fill="#FDF6E0" stroke="#111" stroke-width="2.5"/>
  <path d="M1119,465 H1141 M1130,454 V476" stroke="#444" stroke-width="3" fill="none"/>

  <!-- Gateway paralelo de junção (+) -->
  <polygon points="1400,720 1430,750 1400,780 1370,750" fill="#FDF6E0" stroke="#111" stroke-width="2.5"/>
  <path d="M1390,750 H1410 M1400,740 V760" stroke="#444" stroke-width="3" fill="none"/>

  <!-- Fim recusado -->
  <circle cx="980" cy="565" r="20" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="1012" y="569" font-size="13" font-weight="bold" fill="#444">Fim (recusado)</text>

  <!-- Fim do processo da loja -->
  <circle cx="1540" cy="465" r="20" fill="#fff" stroke="#111" stroke-width="4"/>
  <text x="1540" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Fim</text>

  <!-- Fluxo Loja -->
  <g stroke="#111" stroke-width="2" fill="none" marker-end="url(#seta)">
    <line x1="760" y1="465" x2="788" y2="465"/>
    <line x1="852" y1="465" x2="900" y2="465"/>
    <line x1="1050" y1="465" x2="1098" y2="465"/>
    <line x1="820" y1="497" x2="820" y2="533"/>
    <line x1="895" y1="565" x2="960" y2="565"/>
    <path d="M1130,497 V690 H1180"/>
    <path d="M1130,690 V810 H1180"/>
    <path d="M1330,690 H1350 V750 H1370"/>
    <path d="M1330,810 H1350 V750"/>
    <line x1="1400" y1="720" x2="1400" y2="500"/>
    <line x1="1475" y1="465" x2="1520" y2="465"/>
  </g>
  <!-- rótulos dos ramos -->
  <text x="876" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#276749">Sim</text>
  <text x="832" y="521" font-size="14" font-weight="bold" fill="#C53030">Não</text>

  <!-- ================= MENSAGENS ENTRE PISCINAS ================= -->
  <g stroke="#C53030" stroke-width="2" stroke-dasharray="8 5" fill="none" marker-end="url(#msg)">
    <line x1="685" y1="245" x2="685" y2="430"/>
    <line x1="1400" y1="430" x2="1400" y2="245"/>
  </g>
  <text x="697" y="338" font-size="13" font-weight="bold" fill="#C53030">Pedido + pagamento</text>
  <text x="1412" y="338" font-size="13" font-weight="bold" fill="#C53030">Entrega</text>

  <!-- ================= LEGENDA ================= -->
  <text x="40" y="930" font-size="14" font-weight="bold" fill="#333">Legenda:</text>
  <circle cx="128" cy="925" r="8" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="144" y="930" font-size="14" fill="#333">Início / Fim</text>
  <rect x="245" y="915" width="28" height="20" rx="5" fill="#EAF0FF" stroke="#2B6CB0" stroke-width="1.5"/>
  <text x="281" y="930" font-size="14" fill="#333">Tarefa</text>
  <polygon points="372,914 383,925 372,936 361,925" fill="#FDF6E0" stroke="#111" stroke-width="1.5"/>
  <path d="M368,921 L376,929 M376,921 L368,929" stroke="#444" stroke-width="1.5"/>
  <text x="392" y="930" font-size="14" fill="#333">Gateway exclusivo (X)</text>
  <polygon points="568,914 579,925 568,936 557,925" fill="#FDF6E0" stroke="#111" stroke-width="1.5"/>
  <path d="M563,925 H573 M568,920 V930" stroke="#444" stroke-width="1.5"/>
  <text x="588" y="930" font-size="14" fill="#333">Gateway paralelo (+)</text>
  <line x1="742" y1="925" x2="786" y2="925" stroke="#C53030" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#msg)"/>
  <text x="796" y="930" font-size="14" fill="#333">Mensagem entre piscinas</text>

  <text x="40" y="967" font-size="14" fill="#4A5568">Fluxo: Cliente escolhe → paga → Loja valida pagamento → se aprovado, em paralelo separa estoque + embala/envia → confirma envio → Cliente recebe e avalia.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
